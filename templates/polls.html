{% extends "base.html" %}

{% block content %}
<h1>Created polls</h1>
{% for poll in polls %}
    <div class="poll">
        <h3>{{ poll.question }}</h3>
        <ul>
            {% for option in poll.options %}
                <li>{{ option }}</li>
            {% endfor %}
        </ul>
    </div>
{% else %}
    <p>No polls created yet.</p>
{% endfor %}
<div class="mb-2">
    <a href="{{ url_for('create_poll') }}" class="btn btn-primary">Create New Poll</a>
</div>
{% endblock %}
